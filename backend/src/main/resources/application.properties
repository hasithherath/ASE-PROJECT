spring.application.name=library-management-system

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed Data (Handled by DataInitializer.java)
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
lms.app.jwtSecret=SecretKey038450938450938450938450938450938450938450938450938450938450938450
lms.app.jwtExpirationMs=86400000

# Server Configuration
server.port=8081
