spring.application.name=library-management-system

# SQL Server Configuration (SQL Server Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=lms_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Seed Data (Handled by DataInitializer.java)
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
lms.app.jwtSecret=SecretKey038450938450938450938450938450938450938450938450938450938450938450
lms.app.jwtExpirationMs=86400000

# Server Configuration
server.port=8080
